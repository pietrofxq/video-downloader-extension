<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Video Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-title">
        <h1>Video Downloader</h1>
        <span class="version" id="ext-version"></span>
      </div>
      <div class="header-actions">
        <button
          type="button"
          class="header-btn"
          id="reset-tab"
          title="Reset detected videos"
          aria-label="Reset detected videos"
        >
          &#x21ba;
        </button>
        <button
          type="button"
          class="header-btn"
          id="open-options"
          title="Settings"
          aria-label="Settings"
        >
          &#9881;
        </button>
      </div>
    </header>
    <main id="content"></main>
    <div class="disclaimer-overlay" id="disclaimer" hidden>
      <div class="disclaimer-card" role="dialog" aria-modal="true" aria-labelledby="disclaimer-h">
        <h2 id="disclaimer-h">Before you download</h2>
        <p>
          Only download content you have the right to — content you own, have purchased access to,
          or that is freely licensed. Don't use this to redistribute copyrighted material.
          DRM-protected streams are out of scope.
        </p>
        <button type="button" class="disclaimer-accept" id="disclaimer-accept">I understand</button>
      </div>
    </div>
    <!-- v0.9 (subtitle support) will re-add a footer with a real
         "Include subtitles" toggle bound to detected subtitle tracks.
         Until then the placeholder UI is removed to avoid implying
         functionality the pipeline doesn't have. -->
    <script type="module" src="popup.js"></script>
  </body>
</html>
