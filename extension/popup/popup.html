<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Video Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1>Video Downloader</h1>
      <button type="button" class="gear" id="open-options" title="Settings" aria-label="Settings">
        &#9881;
      </button>
    </header>
    <main id="content" class="empty">
      <p class="empty-title">No videos detected on this tab.</p>
      <p class="empty-hint">Press play on a video for ~2&nbsp;seconds, then reopen this popup.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
